<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Уведомления — помогай.рф</title>
    <link rel="stylesheet" href="/static/style.css?v=8">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #FDF8F5; padding-bottom: 40px; }
        .container { max-width: 500px; margin: 0 auto; }
        
        .header {
            background: linear-gradient(160deg, #FF5A3C 0%, #FF7B5C 35%, #E85D75 100%);
            padding: 16px;
            color: white;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(255,107,74,0.15);
        }
        .back-btn {
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.15);
            border: none; border-radius: 10px;
            color: white; cursor: pointer;
        }
        .back-btn svg { width: 20px; height: 20px; stroke-width: 2.5; }
        .header h1 { font-size: 20px; font-weight: 700; }
        
        .list { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
        
        .notif-card {
            background: white;
            border-radius: 14px;
            padding: 14px 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            text-decoration: none;
            color: #2D2D2D;
            display: block;
            border-left: 3px solid transparent;
            transition: transform 0.1s;
        }
        .notif-card:active { transform: scale(0.98); }
        
        /* По умолчанию — закатная полоса */
        .notif-card { border-left-color: #FF5A3C; }
        /* Специальные типы */
        .notif-card.type-reminder { border-left-color: #8B5BA6; }
        .notif-card.type-goal_approved { border-left-color: #5B9A6B; }
        .notif-card.type-donation_confirmed { border-left-color: #5B9A6B; }
        .notif-card.type-goal_rejected,
        .notif-card.type-goal_reported_hidden { border-left-color: #E57373; }
        .notif-card.type-goal_closed { border-left-color: #D4A853; }
        
        .notif-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
        .notif-message { font-size: 13px; color: #8C7A6B; line-height: 1.5; }
        .notif-time { font-size: 11px; color: #B0A8A0; margin-top: 6px; }
        
        .empty { text-align: center; padding: 60px 20px; color: #8C7A6B; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="back-btn" onclick="history.back()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <h1>Уведомления</h1>
        </div>
        
        <div class="list">
            {% if notifications %}
                {% for n in notifications %}
                <a href="{{ n.action_url or '/goals' }}" class="notif-card type-{{ n.type }}">
                    <div class="notif-title">{{ n.title }}</div>
                    {% if n.message %}
                    <div class="notif-message">{{ n.message }}</div>
                    {% endif %}
                    <div class="notif-time">{{ n.created_at | date_ru }}</div>
                </a>
                {% endfor %}
            {% else %}
                <div class="empty">
                    <div style="font-size: 40px; margin-bottom: 12px;">📭</div>
                    <div>Пока тихо</div>
                </div>
            {% endif %}
        </div>
    </div>
    <script src="/static/toast.js"></script>
</body>
</html>
