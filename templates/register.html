<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — помогай.рф</title>
    <link rel="stylesheet" href="/static/style.css?v=6">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #FDF8F5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .page-back {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border: 1px solid #E0E0E0;
            border-radius: 50%;
            color: #FF5A3C;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: transform 0.1s, box-shadow 0.15s;
            -webkit-tap-highlight-color: transparent;
            z-index: 10;
        }
        .page-back:active { transform: scale(0.92); }
        .page-back svg { width: 20px; height: 20px; }

        .register-box {
            width: 100%;
            max-width: 400px;
        }
        .register-box h1 {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 32px;
            color: #2D2D2D;
        }
        .field {
            margin-bottom: 16px;
        }
        .field label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #8C7A6B;
            margin-bottom: 6px;
            padding-left: 4px;
        }
        .field input[type="text"] {
            width: 100%;
            padding: 16px;
            border: 1px solid #E0E0E0;
            border-radius: 14px;
            font-size: 17px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }
        .field input[type="text"]:focus {
            border-color: #FF6B4A;
        }
        .phone-wrap {
            display: flex;
            align-items: center;
            background: white;
            border: 1px solid #E0E0E0;
            border-radius: 14px;
            padding: 0 16px;
            transition: border-color 0.2s;
        }
        .phone-wrap:focus-within {
            border-color: #FF6B4A;
        }
        .phone-prefix {
            font-size: 17px;
            color: #2D2D2D;
            font-weight: 500;
            padding-right: 8px;
            border-right: 1px solid #E0E0E0;
            margin-right: 8px;
        }
        .phone-wrap input {
            border: none;
            outline: none;
            font-size: 17px;
            font-family: 'Inter', sans-serif;
            padding: 16px 0;
            flex: 1;
            background: transparent;
        }
        .field input[type="password"] {
            width: 100%;
            padding: 16px;
            border: 1px solid #E0E0E0;
            border-radius: 14px;
            font-size: 17px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }
        .field input[type="password"]:focus {
            border-color: #FF6B4A;
        }
        /* Чекбоксы согласия */
        .checkbox-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 14px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            padding: 4px 0;
        }
        .checkbox-row input[type="checkbox"] {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }
        .checkbox-lottie {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
            margin-top: -2px;
            pointer-events: none;
        }
        .checkbox-text {
            font-size: 13px;
            color: #4A4A4A;
            line-height: 1.5;
            padding-top: 3px;
        }
        .doc-link {
            color: #FF5A3C;
            text-decoration: none;
            font-weight: 500;
        }
        .doc-link:active { opacity: 0.7; }

        .btn-disabled {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(0.5);
            box-shadow: none !important;
        }
        .btn-disabled:active {
            transform: none !important;
        }

        .btn-register {
            width: 100%;
            padding: 16px;
            background: linear-gradient(160deg, #FF5A3C 0%, #FF7B5C 35%, #E85D75 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            margin-top: 8px;
            transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 2px 8px rgba(255,107,74,0.12);
            position: relative;
            overflow: hidden;
        }
        .btn-register::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .btn-register:active::after {
            opacity: 1;
        }
        .btn-register:active {
            transform: scale(0.97);
            box-shadow: 0 1px 4px rgba(255,107,74,0.2);
        }

        .bottom-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #8C7A6B;
        }
        .bottom-link a {
            color: #FF6B4A;
            text-decoration: none;
            font-weight: 500;
        }
        .flash {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 14px;
            text-align: center;
        }
        .flash-danger { background: #f8d7da; color: #721c24; }
        .flash-success { background: #d4edda; color: #155724; }
    </style>
</head>
<body>
    <button class="page-back" onclick="goBack()" aria-label="Назад">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <div class="register-box">
        <h1>Регистрация</h1>

        <script id="toast-data" type="application/json">[{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for category, message in messages %}{"category":{{ category|tojson }},"text":{{ message|tojson }}}{% if not loop.last %},{% endif %}{% endfor %}{% endif %}{% endwith %}]</script>

        <form method="POST" id="regForm">
            <input type="text" name="honeypot" style="opacity:0;position:absolute;top:0;left:0;height:0;width:0;z-index:-1;" tabindex="-1" autocomplete="off">
            <input type="hidden" name="form_time" id="formTime">

            <div class="field">
                <label>Как к вам обращаться?</label>
                <input type="text" name="name" placeholder="Необязательно" maxlength="50">
            </div>
            <div class="field">
                <label>Номер телефона</label>
                <div class="phone-wrap">
                    <span class="phone-prefix">+7</span>
                    <input type="tel" name="phone" placeholder="" autofocus required>
                </div>
            </div>
            <div class="field">
                <label>Пароль (минимум 6 символов)</label>
                <input type="password" name="password" placeholder="" required>
            </div>
            <div class="field">
                <label>Подтвердите пароль</label>
                <input type="password" name="password2" placeholder="" required>
            </div>

            <label class="checkbox-row">
                <input type="checkbox" name="agree_terms" id="agreeTerms">
                <span class="checkbox-lottie" id="lottieTerms"></span>
                <span class="checkbox-text">
                    Я принимаю <a href="/terms" target="_blank" class="doc-link">Пользовательское соглашение</a>
                    и <a href="/rules" target="_blank" class="doc-link">Правила размещения целей</a>
                </span>
            </label>

            <label class="checkbox-row">
                <input type="checkbox" name="agree_pd" id="agreePd">
                <span class="checkbox-lottie" id="lottiePd"></span>
                <span class="checkbox-text">
                    Даю <a href="/consent" target="_blank" class="doc-link">согласие на обработку персональных данных</a>
                </span>
            </label>

            <button type="submit" class="btn-cta btn-disabled" id="registerBtn" disabled>Зарегистрироваться</button>
        </form>

        <div class="bottom-link">
            Уже есть аккаунт? <a href="/login">Войти</a>
        </div>
    </div>
<script src="/static/toast.js"></script>
<script src="/static/lottie.min.js"></script>
<script>
    document.getElementById("formTime").value = Date.now()/1000;

    // Lottie-чекбоксы
    var checkboxAnims = {};

    function initCheckbox(id, containerId) {
        var input = document.getElementById(id);
        var container = document.getElementById(containerId);
        if (!input || !container) return;

        var anim = lottie.loadAnimation({
            container: container,
            renderer: 'svg',
            loop: false,
            autoplay: false,
            path: '/static/animations/checkBox.json'
        });

        // Красим: контур (первый path) — закатный, галочка (второй path) — зелёная
        function paint() {
            var paths = container.querySelectorAll('svg path');
            if (paths.length < 2) return;
            var outline = paths[0];
            outline.style.stroke = '#FF5A3C';
            outline.style.strokeWidth = '2';
            outline.style.fill = 'none';
            var check = paths[1];
            check.style.stroke = '#5B9A6B';
            check.style.strokeWidth = '2.5';
            check.style.fill = 'none';
        }

        anim.addEventListener('DOMLoaded', function() {
            paint();
            anim.goToAndStop(0, true);
        });

        anim.addEventListener('enterFrame', function() {
            paint();
        });

        checkboxAnims[id] = anim;

        input.addEventListener('change', function() {
            paint();
            if (input.checked) {
                anim.setDirection(1);
                anim.play();
            } else {
                anim.setDirection(-1);
                anim.play();
            }
            updateButton();
        });
    }

    // Проверка обоих чекбоксов — активация кнопки
    function updateButton() {
        var t = document.getElementById('agreeTerms');
        var p = document.getElementById('agreePd');
        var btn = document.getElementById('registerBtn');
        if (!t || !p || !btn) return;

        if (t.checked && p.checked) {
            btn.disabled = false;
            btn.classList.remove('btn-disabled');
        } else {
            btn.disabled = true;
            btn.classList.add('btn-disabled');
        }
    }

    // Валидация перед отправкой формы
    document.getElementById('regForm').addEventListener('submit', function(e) {
        var t = document.getElementById('agreeTerms');
        var p = document.getElementById('agreePd');
        if (!t.checked || !p.checked) {
            e.preventDefault();
            if (typeof showToast === 'function') {
                showToast('Для регистрации нужно ваше согласие', 'warning');
            }
            return false;
        }
    });

    initCheckbox('agreeTerms', 'lottieTerms');
    initCheckbox('agreePd', 'lottiePd');
    updateButton();
    function goBack() {
        if (document.referrer && document.referrer.indexOf(location.host) !== -1) {
            history.back();
        } else {
            window.location.href = '/';
        }
    }
</script>
</body>
</html>
