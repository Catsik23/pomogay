<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <!-- Закатный градиент для тела -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7B5C"/>
      <stop offset="50%" stop-color="#E85D75"/>
      <stop offset="100%" stop-color="#D44A6A"/>
    </linearGradient>

    <!-- Градиент для крыла -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A3C"/>
      <stop offset="100%" stop-color="#E85D75"/>
    </linearGradient>

    <!-- Градиент для хохолка (золото) -->
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD98C"/>
      <stop offset="100%" stop-color="#D4A853"/>
    </linearGradient>

    <!-- Мягкое свечение вокруг -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8C69" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#FF8C69" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FF8C69" stop-opacity="0"/>
    </radialGradient>

    <!-- Размытие для мягкости -->
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Свечение позади -->
  <ellipse cx="100" cy="130" rx="90" ry="100" fill="url(#glow)"/>

  <!-- Группа журавлика — анимация дыхания -->
  <g class="crane-body" style="transform-origin: 100px 160px;">

    <!-- Хвост — перья -->
    <path d="M 60 150 Q 30 140 20 120 Q 35 135 55 140 Q 40 130 35 110 Q 50 125 65 135 Z"
          fill="url(#wingGrad)" opacity="0.85"/>

    <!-- Тело — овал -->
    <ellipse cx="105" cy="150" rx="42" ry="32" fill="url(#bodyGrad)" filter="url(#softShadow)"/>

    <!-- Крыло сложенное (на теле) -->
    <path d="M 75 145 Q 100 125 135 140 Q 120 155 90 155 Z"
          fill="url(#wingGrad)" opacity="0.9"/>
    <!-- Линии перьев на крыле -->
    <path d="M 85 148 Q 100 142 118 145" stroke="#B83E5C" stroke-width="1" fill="none" opacity="0.4"/>
    <path d="M 82 152 Q 100 148 125 150" stroke="#B83E5C" stroke-width="1" fill="none" opacity="0.4"/>

    <!-- Шея — изгиб -->
    <path d="M 130 140 Q 145 110 140 85 Q 138 75 132 70 L 145 70 Q 155 90 150 130 Z"
          fill="url(#bodyGrad)"/>

    <!-- Голова -->
    <ellipse cx="145" cy="68" rx="18" ry="15" fill="url(#bodyGrad)"/>

    <!-- Хохолок (золотой) -->
    <path d="M 140 55 Q 138 40 148 42 Q 152 38 155 45 Q 158 42 158 52 Q 152 50 150 58 Z"
          fill="url(#crestGrad)"/>

    <!-- Клюв -->
    <path d="M 162 68 L 182 70 L 162 74 Z" fill="#D4A853"/>
    <line x1="162" y1="70" x2="182" y2="70" stroke="#B88A3E" stroke-width="0.5"/>

    <!-- Глаз — с морганием -->
    <g class="crane-eye">
      <circle cx="150" cy="65" r="3.5" fill="#2D2D2D"/>
      <circle cx="151.2" cy="63.8" r="1.2" fill="white"/>
    </g>
    <!-- Веко (для моргания) -->
    <ellipse class="crane-eyelid" cx="150" cy="65" rx="5" ry="0" fill="url(#bodyGrad)"/>

    <!-- Нога 1 (стоит) -->
    <path d="M 100 178 L 98 220 L 90 228 M 98 220 L 106 228"
          stroke="#D44A6A" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Нога 2 (поджата) -->
    <path d="M 118 178 L 122 195 L 132 195"
          stroke="#D44A6A" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Тень под журавликом -->
  <ellipse cx="100" cy="232" rx="35" ry="4" fill="#2D2D2D" opacity="0.08"/>
</svg>
